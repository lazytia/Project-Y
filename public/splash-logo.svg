<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Matches the boot-splash design in RootLayout: black rounded square
       with a bold white "Y" mark, and the wordmark stacked below it —
       "Project" over "YURICA", so the name reads as a block under the icon
       instead of a long thin line that has to shrink to fit.

       Source of truth for public/splash/*.png. Those are flat images, so a
       change here is invisible until scripts/generate-splash.mjs regenerates
       them; leave the two out of step and the app opens on the old artwork
       and swaps to the new one a beat later. -->
  <rect x="176" y="120" width="160" height="160" rx="40" fill="#111111"/>
  <text x="256" y="240"
        text-anchor="middle"
        font-family="Arial Black, Arial, sans-serif"
        font-weight="900"
        font-size="96"
        fill="#ffffff">Y</text>
  <!-- The three baselines below are not round numbers, and should not be
       rounded: they were solved so the white space under the logo, and the
       white space between the two words, measure the same 30 units. Type
       metrics are what make that awkward — "Project" hangs a "j" below its
       baseline and "YURICA" has nothing below its own, so equal baseline
       steps would look unequal. scripts/measure-splash.mjs prints both gaps;
       keep them at 30 if you move anything here. -->
  <text x="256" y="334"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-weight="600"
        font-size="34"
        letter-spacing="1.5"
        fill="#111111">Project</text>
  <text x="256" y="396"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-weight="600"
        font-size="34"
        letter-spacing="1.5"
        fill="#111111">YURICA</text>
</svg>
