<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Matches the boot-splash design in RootLayout: black rounded square with
       a bold white "Y" mark, and "YURICA" under it. Not the full "Project
       YURICA" — this is the same name that sits under the icon the user just
       tapped, and a wordmark is not a sentence.

       Source of truth for public/splash/*.png. Those are flat images, so a
       change here is invisible until scripts/generate-splash.mjs regenerates
       them; leave the two out of step and the app opens on the old artwork
       and swaps to the new one a beat later. -->
  <rect x="176" y="120" width="160" height="160" rx="40" fill="#111111"/>
  <text x="256" y="240"
        text-anchor="middle"
        font-family="Arial Black, Arial, sans-serif"
        font-weight="900"
        font-size="96"
        fill="#ffffff">Y</text>
  <!-- Baseline solved, not chosen, so exactly 30 units of white sit between
       the bottom of the mark and the top of the letters. The cap height of
       Arial at this size is the awkward part: it is what the eye measures
       from, and it is not the baseline. scripts/measure-splash.mjs renders
       this file and prints the gap — keep it at 30 if you move anything. -->
  <text x="256" y="334.5"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-weight="600"
        font-size="34"
        letter-spacing="1.5"
        fill="#111111">YURICA</text>
</svg>
